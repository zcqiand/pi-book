# .github/workflows/pr-summary.yml
# 前置：runner（平台的执行机）上安装 Pi 并配好凭据，步骤从略；语法细节以平台当前稳定文档为准
name: pr-summary
on:
  pull_request:
    branches: [main]

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0                      # 拉全历史，diff 才有 main 基准

      - name: 生成 diff（stage 1 同构）
        run: git diff origin/main...HEAD > ci/artifacts/pr.diff

      - name: Pi 无头生成 PR 摘要（stage 2 同构）
        env:
          PI_API_KEY: ${{ secrets.PI_API_KEY }}   # 凭据走 secrets，仓库文件零明文
        run: |
          pi -p --no-session --model <轻量档> @ci/artifacts/pr.diff \
            "你是流水线里的摘要机器人。基于这个 diff 产出 PR 摘要，必须且只能包含三节，节标题依次为：改了什么、为什么改、风险点。" \
            > ci/artifacts/summary.md

      - name: 设卡校验（stage 3 同构）
        run: |
          FAIL=0
          for sec in "改了什么" "为什么改" "风险点"; do
            grep -q "$sec" ci/artifacts/summary.md || { echo "GATE 缺节: $sec"; FAIL=1; }
          done
          grep -q "discount" ci/artifacts/summary.md || FAIL=1
          [ "$FAIL" = "0" ] || exit 1         # 不过卡，运行判红

      - name: 归档摘要（stage 4 同构）
        run: cp ci/artifacts/summary.md ci/artifacts/summary.final

      - name: 上传产出物
        uses: actions/upload-artifact@v4
        with:
          name: pr-summary
          path: ci/artifacts/summary.final